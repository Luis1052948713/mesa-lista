<title>Mesa Lista</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky tab bar over a working canvas; kitchen-ticket ("comanda") motif for budgets, floor plan for the room. */
:root{
  --bg:#F1F3ED; --surface:#FFFFFF; --sunken:#E6EAE0; --line:#D2D8CA; --ink:#17201A; --muted:#5A665D;
  --olive:#2E4A34; --on-olive:#FFFFFF; --olive-soft:#DCE6D8;
  --saffron:#C98A12; --saffron-soft:#F6E8C6; --saffron-ink:#6A4600;
  --chili:#B0381E; --chili-soft:#F6DCD4;
  --sky:#2B5884; --sky-soft:#DBE5F0;
  --ok:#287045; --ok-soft:#D5EBDC;
  --shadow:0 1px 2px rgba(23,32,26,.06),0 10px 30px rgba(23,32,26,.10);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1411; --surface:#171E19; --sunken:#1F2821; --line:#304036; --ink:#E6EBE3; --muted:#98A59A;
  --olive:#93C09B; --on-olive:#0D1A10; --olive-soft:#1E3324;
  --saffron:#E8B24C; --saffron-soft:#3A2E15; --saffron-ink:#F3CB78;
  --chili:#EC7B62; --chili-soft:#3D211B;
  --sky:#86B3DE; --sky-soft:#1B2A39;
  --ok:#6DC48F; --ok-soft:#183223;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#171E19; --sunken:#1F2821; --line:#304036; --ink:#E6EBE3; --muted:#98A59A;
  --olive:#93C09B; --on-olive:#0D1A10; --olive-soft:#1E3324;
  --saffron:#E8B24C; --saffron-soft:#3A2E15; --saffron-ink:#F3CB78;
  --chili:#EC7B62; --chili-soft:#3D211B;
  --sky:#86B3DE; --sky-soft:#1B2A39;
  --ok:#6DC48F; --ok-soft:#183223;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.02em}
h3{font-size:17px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.03em;display:block;line-height:1}
.brand span{font-size:13px;color:var(--muted)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.tab:hover{background:var(--sunken);color:var(--ink)}
.tab.on{background:var(--olive);color:var(--on-olive)}
.badge{font-family:var(--f-mono);font-size:11px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;display:inline-grid;place-items:center;background:var(--chili);color:#fff}
.tab.on .badge{background:var(--saffron);color:#1b1404}

main{padding-block:24px 48px;display:grid;gap:24px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.head p{color:var(--muted);margin-top:4px;max-width:62ch}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{background:var(--saffron);border-color:var(--saffron);color:#1b1404}
.btn.danger{color:var(--chili)}
.btn.danger[data-armed]{background:var(--chili);border-color:var(--chili);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn.ghost{border-color:transparent;background:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
textarea{resize:vertical;min-height:60px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-pendiente{background:var(--saffron-soft);color:var(--saffron-ink)}
.p-confirmada{background:var(--sky-soft);color:var(--sky)}
.p-atendida{background:var(--ok-soft);color:var(--ok)}
.p-cancelada{background:var(--sunken);color:var(--muted)}
.fc{font-family:var(--f-mono);font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.fc.ok{background:var(--ok-soft);color:var(--ok)} .fc.warn{background:var(--saffron-soft);color:var(--saffron-ink)} .fc.bad{background:var(--chili-soft);color:var(--chili)}
.tag{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--sunken);color:var(--muted);font-weight:600}
.tag.alert{background:var(--chili-soft);color:var(--chili)}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel > h3{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:clamp(24px,3.4vw,34px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.hero{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.kpi.hero .s,.kpi.hero .eyebrow{color:var(--on-olive);opacity:.8}

/* lists */
.list{display:grid}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item:hover{background:var(--sunken)}
.time{font-family:var(--f-mono);font-weight:700;font-size:18px;min-width:60px}
.time small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.item .who{font-weight:700}
.item .meta{font-size:13px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap}
.item .right{text-align:right;display:grid;gap:4px;justify-items:end}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

.alerts{display:grid;gap:10px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--sunken)}
.alert .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700}
.alert.red .ic{background:var(--chili);color:#fff}
.alert.amber .ic{background:var(--saffron);color:#1b1404}
.alert.blue .ic{background:var(--sky);color:var(--surface)}
.alert.green .ic{background:var(--ok);color:var(--surface)}
.alert b{display:block}
.alert span{font-size:13px;color:var(--muted)}

/* chart */
.bars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;align-items:end;height:170px;padding-top:18px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent 37px,var(--line) 37px,var(--line) 38px)}
.bar{position:relative;background:var(--olive);border-radius:5px 5px 0 0;min-height:2px;cursor:pointer;border:0;padding:0}
.bar.today{background:var(--saffron)}
.bar.zero{background:var(--line)}
.bar i{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:700 11px var(--f-mono);font-style:normal;color:var(--ink);padding-bottom:3px}
.bar-labels{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;font-size:11px;color:var(--muted);text-align:center;margin-top:6px;line-height:1.2}
.bar-labels b{display:block;color:var(--ink);font-family:var(--f-mono)}

/* agenda */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.day{flex:none;width:84px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;cursor:pointer;text-align:center;display:grid;gap:1px}
.day .dn{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.day .dd{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.1}
.day .dc{font-size:11.5px;color:var(--muted)}
.day.on{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.day.on .dn,.day.on .dc{color:var(--on-olive);opacity:.85}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--saffron);margin:2px auto 0}
.day .dot.none{background:transparent}

/* floor plan */
.scroll-x{overflow-x:auto;border-radius:14px}
.plan{position:relative;aspect-ratio:16/10;min-width:600px;border-radius:14px;border:1px solid var(--line);
  background-color:var(--sunken);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;background-position:-1px -1px}
.zone{position:absolute;border:1.5px dashed var(--muted);border-radius:12px;opacity:.55;pointer-events:none}
.zone span{position:absolute;top:6px;left:10px;font:700 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.tbl{position:absolute;transform:translate(-50%,-50%);display:grid;place-content:center;gap:0;text-align:center;border:2px solid var(--ok);background:var(--surface);color:var(--ink);cursor:pointer;padding:4px;line-height:1.15;transition:transform .15s}
.tbl:hover{transform:translate(-50%,-50%) scale(1.05)}
.tbl.round{border-radius:50%;aspect-ratio:1}
.tbl.rect{border-radius:12px;height:22%}
.tbl b{font:700 14px var(--f-mono)}
.tbl small{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tbl.busy{border-color:var(--saffron);background:var(--saffron-soft)}
.tbl.busy small{color:var(--saffron-ink);font-weight:600}
.tbl.served{border-color:var(--olive);background:var(--olive);color:var(--on-olive)}
.tbl.served small{color:var(--on-olive);opacity:.85}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;border:2px solid}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunken)}
tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
.meter{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--ok);border-radius:4px}
.meter.low i{background:var(--chili)}
td input[type=number]{width:96px;min-height:32px;padding:4px 8px;font-family:var(--f-mono)}

/* menu */
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.dish .top2{display:flex;justify-content:space-between;gap:10px;align-items:start}
.dish h3{font-size:18px}
.dish .figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px;background:var(--sunken);border-radius:10px}
.dish .figs div{display:grid;min-width:0}
.dish .figs span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.dish .figs b{font-family:var(--f-mono);font-size:14px}
.recipe{font-size:13px;display:grid;gap:3px}
.recipe div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding-bottom:3px}
.recipe div span:last-child{font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.hint{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--chili-soft);color:var(--chili)}
.price-in{display:flex;align-items:center;gap:6px}
.price-in input{width:110px;font-family:var(--f-mono)}

/* shopping */
.sup{display:grid;gap:0}
.sup-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.buy{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.buy input[type=checkbox]{width:22px;height:22px;accent-color:var(--olive);cursor:pointer}
.buy .q{font:700 16px var(--f-mono);white-space:nowrap}
.buy .nm{font-weight:600}
.buy .sub{font-size:12.5px;color:var(--muted)}
.buy .pp{display:grid;gap:2px;justify-items:end}
.buy .pp input{width:104px;min-height:32px;padding:4px 8px;font-family:var(--f-mono);font-size:13px}
.buy.done .nm,.buy.done .q{text-decoration:line-through;color:var(--muted)}
@media (max-width:560px){.buy{grid-template-columns:auto minmax(0,1fr) auto}.buy .pp{grid-column:2 / -1;justify-items:start;grid-template-columns:auto auto;align-items:center;gap:8px}}
.progress{height:10px;background:var(--sunken);border-radius:5px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--olive);transition:width .3s}

/* reminders */
.rem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 4px;border-top:1px solid var(--line)}
.rem:first-of-type{border-top:0}
.rem .when{font:700 13px var(--f-mono);padding:6px 8px;border-radius:8px;background:var(--sunken);text-align:center;min-width:74px}
.rem.now .when{background:var(--chili);color:#fff}
.rem.sent .when{background:var(--ok-soft);color:var(--ok)}
.msg{font-size:13px;color:var(--muted);margin-top:4px;padding:8px 10px;border-left:3px solid var(--line);background:var(--sunken);border-radius:0 8px 8px 0}
@media (max-width:640px){.rem{grid-template-columns:auto minmax(0,1fr)}.rem .acts{grid-column:1 / -1}}

/* modal */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,14,11,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--bg);border-radius:18px;width:min(760px,100%);box-shadow:var(--shadow);max-height:100%;overflow-y:auto;display:grid}
.m-head{display:flex;justify-content:space-between;align-items:start;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:1}
.m-body{padding:18px 22px 22px;display:grid;gap:18px}
.x{border:0;background:var(--sunken);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;flex:none}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1 / -1}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.err{background:var(--chili-soft);color:var(--chili);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px}
.steppers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.step{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.step.has{border-color:var(--olive);box-shadow:inset 3px 0 0 var(--olive)}
.step .nm{font-size:14px;font-weight:600;line-height:1.2}
.step .nm small{display:block;font-weight:500;color:var(--muted);font-family:var(--f-mono);font-size:12px}
.step .ctl{display:flex;align-items:center;gap:6px}
.step .ctl button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--sunken);cursor:pointer;font-weight:700}
.step .ctl b{font-family:var(--f-mono);min-width:20px;text-align:center}
.summary{display:flex;gap:8px 20px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--olive);color:var(--on-olive);font-size:14px}
.summary b{font-family:var(--f-mono)}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.dl div{display:grid;gap:2px}
.dl b{font-weight:600}
.callout{padding:10px 12px;border-radius:10px;font-size:14px}
.callout.red{background:var(--chili-soft);color:var(--chili)}
.callout.amber{background:var(--saffron-soft);color:var(--saffron-ink)}

/* comanda ticket */
.ticket{position:relative;background:var(--surface);font-family:var(--f-mono);font-size:13px;padding:18px 18px 22px;border-radius:6px 6px 0 0;box-shadow:var(--shadow);margin-bottom:10px}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;background:radial-gradient(circle at 7px 0,var(--surface) 6.5px,transparent 7px) 0 0/14px 10px repeat-x}
.ticket .tt{text-align:center;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.ticket .ts{text-align:center;color:var(--muted);font-size:12px}
.ticket hr{border:0;border-top:1.5px dashed var(--line);margin:10px 0}
.ticket .ln{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.ticket .ln span:first-child{min-width:0}
.ticket .ln.big{font-size:16px;font-weight:700}
.ticket .ln.dim{color:var(--muted)}

let S;
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);if(x&&x.v===1){S=x;return}}}catch(e){}S=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const UI={view:'hoy',agendaDay:todayISO(),plDate:todayISO(),plSlot:new Date().getHours()>=15?'19:30':'13:00',shopDays:7};
const ing=id=>S.ingredients.find(i=>i.id===id);
const dish=id=>S.dishes.find(d=>d.id===id);
const table=id=>S.tables.find(t=>t.id===id);
const resv=id=>S.reservations.find(r=>r.id===id);
const byTime=(a,b)=>(a.date+a.time).localeCompare(b.date+b.time);
const dishCost=d=>d.recipe.reduce((s,[i,q])=>s+q*(ing(i)?.price||0),0);
const fcClass=fc=>fc<.30?'ok':fc<.36?'warn':'bad';
function quote(r){
  const lines=(r.items||[]).filter(([d])=>dish(d)).map(([d,q])=>({d:dish(d),q,total:q*dish(d).price,cost:q*dishCost(dish(d))}));
  const sub=lines.reduce((s,l)=>s+l.total,0),cost=lines.reduce((s,l)=>s+l.cost,0),inc=sub*.08;
  return {lines,sub,cost,inc,total:sub+inc,tip:sub*.1,margin:sub-cost,fc:sub?cost/sub:0,due:Math.max(0,sub+inc-(r.deposit||0))};
}
function qf(q,unit){
  if(unit==='und')return `${Math.round(q*10)/10} und`;
  if(q<1)return `${Math.round(q*1000)} ${unit==='kg'?'g':'ml'}`;
  return `${(Math.round(q*100)/100).toLocaleString('es-CO')} ${unit}`;
}
function upcoming(n){const a=todayISO(),b=isoDate(addDays(new Date(),n));return S.reservations.filter(r=>r.status!=='cancelada'&&r.date>=a&&r.date<b).sort(byTime)}
function conflict(tid,date,time,except){return S.reservations.find(r=>r.id!==except&&r.table===tid&&r.date===date&&r.status!=='cancelada'&&Math.abs(toMin(r.time)-toMin(time))<120)}
function relTime(ms){
  const m=Math.round(ms/60000);if(m<60)return `${m} min`;
  const h=Math.floor(m/60);if(h<24)return `${h} h ${m%60?(m%60)+' min':''}`.trim();
  const d=Math.round(h/24);return `${d} ${d===1?'día':'días'}`;
}
function whenWord(iso){const t=todayISO();if(iso===t)return 'hoy';if(iso===isoDate(addDays(new Date(),1)))return 'mañana';return 'el '+fmtLong(iso)}

/* reminders */
function reminders(){
  const now=Date.now(),out=[];
  for(const r of S.reservations){
    if(r.status==='cancelada'||r.status==='atendida')continue;
    const dt=parseDT(r.date,r.time).getTime();if(dt<now)continue;
    for(const R of REM){
      const due=dt-R.h*3600e3,sent=r.rem?.[R.k];
      out.push({r,R,due,st:sent?'enviado':now>=due?'ahora':'programado'});
    }
  }
  return out.sort((a,b)=>a.due-b.due);
}
function remMsg(r){
  const t=table(r.table);
  return `Hola ${r.name}, te escribimos de ${S.brand.name}. Te esperamos ${whenWord(r.date)} a las ${r.time} para ${r.people} ${r.people===1?'persona':'personas'}${t?` (mesa ${t.name}, ${t.zone.toLowerCase()})`:''}. ¿Nos confirmas tu asistencia? Responde SÍ para confirmar o NO si necesitas cancelar.`;
}
function waLink(phone,text){const p=String(phone||'').replace(/\D/g,'');const n=p.length===10?'57'+p:p;return `https://wa.me/${n}?text=${encodeURIComponent(text)}`}

/* shopping */
function roundBuy(q,unit){if(q<=1e-9)return 0;return unit==='und'?Math.ceil(q-1e-9):Math.ceil(q*20-1e-9)/20}
function shopping(days){
  const a=todayISO(),b=isoDate(addDays(new Date(),days)),need={};
  const resIn=S.reservations.filter(r=>r.status!=='cancelada'&&r.status!=='atendida'&&r.date>=a&&r.date<b);
  for(const r of resIn)for(const[d,q]of r.items){const D=dish(d);if(D)for(const[i,qq]of D.recipe)need[i]=(need[i]||0)+q*qq}
  const rows=S.ingredients.map(g=>{
    const n=need[g.id]||0,target=n*(1+S.cfg.merma)+(S.cfg.keepMin?g.min:0);
    const buy=roundBuy(Math.max(0,target-g.stock),g.unit);
    return {g,need:n,buy,est:buy*g.price};
  }).filter(x=>x.buy>0);
  return {rows,resIn,total:rows.reduce((s,x)=>s+x.est,0)};
}

  </button>`;
}

  const days=[...Array(14)].map((_,i)=>{const iso=isoDate(addDays(new Date(),i));const rs=S.reservations.filter(r=>r.date===iso&&r.status!=='cancelada');return {iso,p:rs.reduce((s,r)=>s+r.people,0)}});
  const max=Math.max(...days.map(x=>x.p),1);
  const alerts=[
    remNow.length&&{c:'red',ic:remNow.length,t:`${remNow.length===1?'Un recordatorio listo':remNow.length+' recordatorios listos'} para enviar`,s:remNow.slice(0,2).map(x=>x.r.name).join(', ')+(remNow.length>2?'…':''),a:'recordatorios',b:'Enviar'},
    pend.length&&{c:'amber',ic:pend.length,t:`Reservas sin confirmar en los próximos 3 días`,s:pend.slice(0,3).map(r=>r.name).join(', '),a:'recordatorios',b:'Revisar'},
    shop.rows.length&&{c:'blue',ic:shop.rows.length,t:`Insumos por comprar para 3 días`,s:`Costo estimado ${money(shop.total)}`,a:'compras',b:'Ver lista'},
    low.length&&{c:'red',ic:low.length,t:`Insumos bajo el mínimo`,s:low.slice(0,3).map(g=>g.name).join(', ')+(low.length>3?'…':''),a:'inventario',b:'Inventario'},
    noPre.length&&{c:'amber',ic:noPre.length,t:`Reservas sin pre-pedido`,s:'Pide el menú por WhatsApp para calcular compras',a:'agenda',b:'Agenda'}
  ].filter(Boolean);
  return `
  <div class="head"><div><div class="eyebrow">${fmtLong(t)}</div><h2>Así va el servicio de hoy</h2></div>
    <div class="row"><button class="btn" data-act="go" data-v="salon">Ver salón</button><button class="btn" data-act="go" data-v="compras">Lista de compras</button></div></div>
  <section class="kpis">

  <div class="row" style="justify-content:space-between">
    <div class="legend"><span><i style="border-color:var(--ok);background:var(--surface)"></i>Libre</span><span><i style="border-color:var(--saffron);background:var(--saffron-soft)"></i>Reservada</span><span><i style="border-color:var(--olive);background:var(--olive)"></i>Atendida</span></div>

function vAgenda(){

    <button class="btn primary" data-act="new" data-d="${sel}">+ Reserva para este día</button></div>

function vRem(){

    const when=x.st==='ahora'?'AHORA':x.st==='enviado'?'ENVIADO':'en '+relTime(x.due-Date.now());
    return `<div class="rem ${x.st==='ahora'?'now':x.st==='enviado'?'sent':''}">
      <div class="when">${when}<div style="font-weight:500;font-size:11px;opacity:.85">${x.R.label}</div></div>
      <div style="min-width:0"><div class="row" style="gap:8px"><b>${esc(r.name)}</b><span class="pill p-${r.status}">${STATUS[r.status]}</span></div>

        ${x.st==='enviado'?`<button class="btn sm ghost" data-act="open" data-id="${r.id}">Ver reserva</button>`:''}

  <div class="head"><div><div class="eyebrow">Notificaciones</div><h2>Recordatorios a clientes</h2><p>Cada reserva programa dos recordatorios: 24 horas y 2 horas antes. Cuando llega la hora, la app te avisa aquí y en la pestaña. Copia el mensaje o ábrelo en WhatsApp y márcalo como enviado.</p></div></div>
  ${block('Para enviar ahora',now,'No hay recordatorios pendientes por enviar.')}
  ${block('Programados',prog,'No hay recordatorios programados.')}
  ${block('Enviados',sent,'Todavía no has enviado recordatorios.')}`;
}

function openDetail(id){
  const r=resv(id);if(!r)return;const t=table(r.table);
  const rems=REM.map(R=>{const due=parseDT(r.date,r.time).getTime()-R.h*3600e3;const sent=r.rem?.[R.k];
    const st=sent?'Enviado':r.status==='atendida'||r.status==='cancelada'?'No aplica':Date.now()>=due?'Listo para enviar':'Programado para '+fmtDay(isoDate(new Date(due)))+' '+pad(new Date(due).getHours())+':'+pad(new Date(due).getMinutes());
    return `<div class="row" style="justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)"><span><b>${R.label}</b> · <span class="muted">${st}</span></span>${!sent&&r.status!=='atendida'&&r.status!=='cancelada'?`<button class="btn sm" data-act="sent" data-id="${r.id}" data-k="${R.k}">Marcar enviado</button>`:''}</div>`}).join('');
  const acts=[];
  if(r.status==='pendiente')acts.push(`<button class="btn primary" data-act="confirm" data-id="${r.id}">Confirmar</button>`);
  if(r.status==='pendiente'||r.status==='confirmada')acts.push(`<button class="btn" data-act="serve" data-id="${r.id}">Marcar atendida</button>`,`<button class="btn danger" data-act="cancel" data-id="${r.id}">Cancelar reserva</button>`);
  if(r.status==='cancelada')acts.push(`<button class="btn" data-act="reopen" data-id="${r.id}">Reactivar</button>`);
  openModal(`
    <div class="m-head"><div><div class="eyebrow">${r.id} · ${fmtLong(r.date)}</div><h2 style="font-size:24px">${esc(r.name)}</h2><div class="row" style="margin-top:6px"><span class="pill p-${r.status}">${STATUS[r.status]}</span>${r.occasion?`<span class="tag">${esc(r.occasion)}</span>`:''}</div></div><button class="x" data-act="close" aria-label="Cerrar">×</button></div>
    <div class="m-body">
      <div class="dl">
        <div><span class="eyebrow">Hora</span><b class="mono">${r.time}</b></div>
        <div><span class="eyebrow">Personas</span><b>${r.people}</b></div>
        <div><span class="eyebrow">Mesa</span><b>${t?esc(t.name)+' · '+t.zone:'Sin mesa'}</b></div>
        <div><span class="eyebrow">Teléfono</span><b class="mono" style="user-select:all">${esc(r.phone)||'—'}</b></div>
      </div>
      ${r.allergies?`<div class="callout red"><b>Alergias:</b> ${esc(r.allergies)}</div>`:''}
      ${r.notes?`<div class="callout amber"><b>Notas:</b> ${esc(r.notes)}</div>`:''}
      ${r.status==='atendida'?'<div class="muted" style="font-size:13px">Reserva atendida. Los insumos de su pedido ya se descontaron del inventario.</div>':''}
      <div class="row">${acts.join('')}<button class="btn" data-act="edit" data-id="${r.id}">Editar</button></div>
      <div><h3 style="margin-bottom:4px">Recordatorios</h3>${rems}</div>
      <div><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3>Presupuesto</h3>${r.items.length?`<button class="btn sm" data-act="copyQuote" data-id="${r.id}">Copiar cotización</button>`:''}</div>${ticketHTML(r)}</div>
    </div>`);
}

let F=null;
function openForm(r,preset={}){
  F={id:r?.id||null,items:Object.fromEntries((r?.items||[]).map(([d,q])=>[d,q]))};
  const v={name:'',phone:'',date:preset.date||todayISO(),time:preset.time||'19:30',people:2,table:preset.table||'',occasion:'',allergies:'',notes:'',deposit:0,...(r||{})};
  if(preset.table&&!r)v.people=Math.min(table(preset.table).seats,Math.max(2,table(preset.table).seats-2));
  openModal(`
    <div class="m-head"><div><div class="eyebrow">${r?r.id:'Nueva reserva'}</div><h2 style="font-size:24px">${r?'Editar reserva':'Reservar mesa'}</h2></div><button class="x" data-act="close" aria-label="Cerrar">×</button></div>
    <form class="m-body" id="rf" novalidate>
      <div class="fgrid">
        <div class="field"><label for="f-name">Nombre de quien reserva</label><input type="text" id="f-name" value="${esc(v.name)}" placeholder="Ej. Carolina Díaz" autocomplete="off"></div>
        <div class="field"><label for="f-phone">Celular (WhatsApp)</label><input type="tel" id="f-phone" value="${esc(v.phone)}" placeholder="3001234567" autocomplete="off"></div>
        <div class="field"><label for="f-date">Fecha</label><input type="date" id="f-date" value="${v.date}"></div>
        <div class="field"><label for="f-time">Hora</label><select id="f-time">${SLOTS.map(s=>`<option ${s===v.time?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="field"><label for="f-people">Personas</label><input type="number" id="f-people" min="1" max="40" value="${v.people}"></div>
        <div class="field"><label for="f-table">Mesa</label><select id="f-table"></select></div>
        <div class="field"><label for="f-occ">Ocasión</label><select id="f-occ">${OCCASIONS.map(o=>`<option value="${o}" ${o===v.occasion?'selected':''}>${o||'Ninguna'}</option>`).join('')}</select></div>
        <div class="field"><label for="f-dep">Anticipo recibido (COP)</label><input type="number" id="f-dep" min="0" step="10000" value="${v.deposit||0}"></div>
        <div class="field"><label for="f-all">Alergias o restricciones</label><input type="text" id="f-all" value="${esc(v.allergies)}" placeholder="Ej. sin lácteos"></div>
        <div class="field"><label for="f-notes">Notas</label><input type="text" id="f-notes" value="${esc(v.notes)}" placeholder="Ej. traen torta"></div>
      </div>
      <div><h3>Pre-pedido</h3><p class="muted" style="font-size:13px;margin:2px 0 10px">Con el pre-pedido la app calcula el presupuesto y la lista de compras.</p><div class="steppers" id="f-items"></div></div>
      <div class="summary" id="f-sum"></div>
      <div id="f-err" class="err" hidden></div>
      <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-act="close">Cancelar</button><button type="submit" class="btn primary">${r?'Guardar cambios':'Guardar reserva'}</button></div>
    </form>`);
  fillTables(v.table);renderSteps();updSum();
}
function fillTables(sel){
  const date=$('#f-date').value,time=$('#f-time').value,ppl=parseInt($('#f-people').value)||1;
  $('#f-table').innerHTML=`<option value="">Asignar automáticamente</option>`+S.tables.map(t=>{const c=conflict(t.id,date,time,F.id);const small=t.seats<ppl;
    return `<option value="${t.id}" ${t.id===sel?'selected':''}>${t.name} · ${t.seats} puestos · ${t.zone}${c?' · ocupada '+c.time:small?' · pequeña':''}</option>`}).join('');
}
function renderSteps(){
  $('#f-items').innerHTML=S.dishes.map(d=>{const q=F.items[d.id]||0;return `<div class="step ${q?'has':''}"><div class="nm">${esc(d.name)}<small>${money(d.price)}</small></div><div class="ctl"><button type="button" data-act="dec" data-d="${d.id}" aria-label="Quitar ${esc(d.name)}">−</button><b>${q}</b><button type="button" data-act="inc" data-d="${d.id}" aria-label="Agregar ${esc(d.name)}">+</button></div></div>`}).join('');
}
function updSum(){
  const q=quote({items:Object.entries(F.items).filter(([,n])=>n>0),deposit:parseFloat($('#f-dep').value)||0});
  $('#f-sum').innerHTML=q.sub?`<span>Total <b>${money(q.total)}</b></span><span>Costo insumos <b>${money(q.cost)}</b></span><span>Margen <b>${money(q.margin)}</b></span><span>Food cost <b>${pct(q.fc)}</b></span>${q.due!==q.total?`<span>Saldo <b>${money(q.due)}</b></span>`:''}`:'<span>Agrega platos para ver el presupuesto.</span>';
}
function saveForm(e){
  e.preventDefault();
  const g=id=>$('#'+id).value.trim(),err=m=>{const el=$('#f-err');el.textContent=m;el.hidden=false;el.scrollIntoView({block:'nearest'})};
  const name=g('f-name'),date=g('f-date'),time=g('f-time'),people=parseInt(g('f-people'))||0;
  if(!name)return err('Escribe el nombre de quien reserva.');
  if(!date)return err('Elige la fecha de la reserva.');
  if(people<1)return err('La reserva necesita al menos 1 persona.');
  let tid=g('f-table');
  if(tid){const t=table(tid);if(t.seats<people)return err(`La mesa ${t.name} es para ${t.seats} personas. Elige una más grande o deja "Asignar automáticamente".`);
    const c=conflict(tid,date,time,F.id);if(c)return err(`La mesa ${t.name} ya está reservada a las ${c.time} por ${c.name}. Elige otra mesa u otra hora.`)}
  else{const free=S.tables.filter(t=>t.seats>=people&&!conflict(t.id,date,time,F.id)).sort((a,b)=>a.seats-b.seats)[0];
    if(!free)return err(`No hay mesas libres para ${people} personas a las ${time}. Prueba otra hora.`);tid=free.id}
  const data={name,phone:g('f-phone'),date,time,people,table:tid,occasion:g('f-occ'),allergies:g('f-all'),notes:g('f-notes'),deposit:parseFloat(g('f-dep'))||0,items:Object.entries(F.items).filter(([,q])=>q>0)};
  let msg;
  if(F.id){const r=resv(F.id);const moved=r.date!==date||r.time!==time;Object.assign(r,data);if(moved)r.rem={};msg=`Reserva ${r.id} actualizada${moved?'. Recordatorios reprogramados.':'.'}`}
  else{const r={id:'R-'+(S.next++),status:'pendiente',rem:{},...data};S.reservations.push(r);msg=`Reserva ${r.id} guardada en ${table(tid).name}. Recordatorios programados 24 h y 2 h antes.`}
  save();closeModal();UI.agendaDay=date;UI.plDate=date;render();toast(msg);
}

/* ---------- actions ---------- */
function toast(m,kind){const el=document.createElement('div');el.className='toast '+(kind||'');el.textContent=m;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),kind==='alert'?8000:4200)}
function copy(text,label){
  const ok=()=>toast(label||'Copiado');
  try{navigator.clipboard.writeText(text).then(ok).catch(()=>fallback())}catch(e){fallback()}
  function fallback(){openModal(`<div class="m-head"><h2 style="font-size:22px">Copia este texto</h2><button class="x" data-act="close" aria-label="Cerrar">×</button></div><div class="m-body"><textarea id="copy-area" rows="10">${esc(text)}</textarea></div>`);setTimeout(()=>{const a=$('#copy-area');a.focus();a.select()},40)}
}
function shopText(rows,sup){
  const lines=rows.map(x=>`• ${x.g.name}: ${qf(x.buy,x.g.unit)}`);
  return sup?`Hola, pedido para ${S.brand.name}:\n${lines.join('\n')}\nGracias.`:`Lista de mercado ${S.brand.name} (${UI.shopDays} días)\n\n`+Object.entries(rows.reduce((a,x)=>((a[x.g.sup]=a[x.g.sup]||[]).push(`• ${x.g.name}: ${qf(x.buy,x.g.unit)}`),a),{})).map(([s,l])=>`${s}\n${l.join('\n')}`).join('\n\n');
}
function consume(r,sign){for(const[d,q]of r.items){const D=dish(d);if(D)for(const[i,qq]of D.recipe){const g=ing(i);g.stock=Math.max(0,Math.round((g.stock-sign*q*qq)*1000)/1000)}}}
function refreshModal(id){if(!$('#overlay').hidden)openDetail(id)}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='overlay')closeModal();return}
  const a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'go':go(el.dataset.v);break;
    case 'new':openForm(null,{date:el.dataset.d});break;
    case 'newAt':openForm(null,{date:UI.plDate,time:UI.plSlot,table:el.dataset.t});break;
    case 'open':openDetail(id);break;
    case 'edit':openForm(resv(id));break;
    case 'close':closeModal();break;
    case 'day':UI.agendaDay=el.dataset.d;go('agenda');break;
    case 'days':UI.shopDays=+el.dataset.n;render();break;
    case 'inc':case 'dec':{const d=el.dataset.d;F.items[d]=Math.max(0,(F.items[d]||0)+(a==='inc'?1:-1));renderSteps();updSum();
      const b=document.querySelector(`[data-act="${a}"][data-d="${d}"]`);b&&b.focus();break}
    case 'confirm':{const r=resv(id);r.status='confirmada';save();render();refreshModal(id);toast(`${r.name}: reserva confirmada.`);break}
    case 'serve':{const r=resv(id);consume(r,1);r.status='atendida';save();render();refreshModal(id);toast(`${r.name}: atendida. Insumos descontados del inventario.`);break}
    case 'cancel':{if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Toca otra vez para cancelar';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent='Cancelar reserva'}},3500);break}
      const r=resv(id);r.status='cancelada';save();render();refreshModal(id);toast(`Reserva de ${r.name} cancelada. La mesa quedó libre.`);break}
    case 'reopen':{const r=resv(id);if(conflict(r.table,r.date,r.time,r.id)){toast('La mesa ya fue tomada por otra reserva. Edita la reserva y elige otra mesa.','alert');break}r.status='pendiente';save();render();refreshModal(id);break}
    case 'sent':{const r=resv(id);r.rem=r.rem||{};r.rem[el.dataset.k]=1;save();render();refreshModal(id);toast(`Recordatorio a ${r.name} marcado como enviado.`);break}
    case 'copyMsg':copy(remMsg(resv(id)),'Mensaje copiado. Pégalo en WhatsApp.');break;
    case 'copyQuote':copy(quoteText(resv(id)),'Cotización copiada.');break;
    case 'copyShop':{const {rows}=shopping(UI.shopDays);rows.length?copy(shopText(rows),'Lista copiada.'):toast('No hay nada por comprar.');break}
    case 'copySup':{const rows=shopping(UI.shopDays).rows.filter(x=>x.g.sup===el.dataset.s);copy(shopText(rows,true),`Pedido para ${el.dataset.s} copiado.`);break}
    case 'registerShop':{const {rows}=shopping(UI.shopDays),done=rows.filter(x=>S.shop.bought[x.g.id]);
      if(!done.length){toast('Marca primero los insumos que compraste.');break}
      let changed=0;for(const x of done){x.g.stock=Math.round((x.g.stock+x.buy)*1000)/1000;const p=parseFloat(S.shop.paid[x.g.id]);if(p>0&&p!==x.g.price){x.g.price=p;changed++}}
      S.shop={bought:{},paid:{}};save();render();toast(`Compra registrada: ${done.length} insumos al inventario${changed?`, ${changed} precios actualizados en las recetas`:''}.`);break}
    case 'reset':{if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Toca otra vez para restablecer';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent='Restablecer datos de ejemplo'}},3500);break}
      delete el.dataset.armed;el.textContent='Restablecer datos de ejemplo';S=seed();save();announced.clear();render();toast('Datos de ejemplo restablecidos.');break}
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='pl-date'&&el.value){UI.plDate=el.value;render()}
  else if(el.id==='pl-slot'){UI.plSlot=el.value;render()}
  else if(el.id==='cfg-merma'){S.cfg.merma=parseFloat(el.value);save();render()}
  else if(el.id==='cfg-min'){S.cfg.keepMin=el.checked;save();render()}
  else if(el.dataset.price){const d=dish(el.dataset.price),v=parseFloat(el.value);if(v>0){d.price=v;save();render();toast(`Precio de ${d.name}: ${money(v)}`)}}
  else if(el.dataset.stock){const g=ing(el.dataset.stock),v=parseFloat(el.value);if(v>=0){g.stock=v;save();render()}}
  else if(el.dataset.buy){const id=el.dataset.buy;if(el.checked)S.shop.bought[id]=1;else delete S.shop.bought[id];save();
    $('#buy-'+id)?.classList.toggle('done',el.checked);const rows=shopping(UI.shopDays).rows,b=rows.filter(x=>S.shop.bought[x.g.id]).length;
    $('#shop-count').textContent=`${b}/${rows.length}`;$('#shop-bar').style.width=`${rows.length?b/rows.length*100:0}%`}
  else if(el.dataset.paid){const v=parseFloat(el.value);if(v>0)S.shop.paid[el.dataset.paid]=v;else delete S.shop.paid[el.dataset.paid];save()}
});
document.addEventListener('input',e=>{
  if(!F||!e.target.closest('#rf'))return;
  const id=e.target.id;
  if(id==='f-date'||id==='f-time'||id==='f-people'){fillTables($('#f-table').value)}
  if(id==='f-dep')updSum();
});
document.addEventListener('submit',e=>{if(e.target.id==='rf')saveForm(e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden)closeModal()});

/* reminder watcher: announces reminders as they come due */
const announced=new Set();
function watch(first){
  for(const x of reminders()){if(x.st!=='ahora')continue;const k=x.r.id+':'+x.R.k;if(announced.has(k))continue;announced.add(k);
    if(!first)toast(`Hora de enviar el recordatorio (${x.R.label}) a ${x.r.name}.`,'alert')}
  renderTabs();
}

load();
const h=(location.hash||'').slice(1);if(VIEWS[h])UI.view=h;
render();watch(true);
const due=reminders().filter(x=>x.st==='ahora').length;
if(due)setTimeout(()=>toast(`Tienes ${due} ${due===1?'recordatorio listo':'recordatorios listos'} para enviar. Míralos en Recordatorios.`,'alert'),600);
setInterval(()=>watch(false),30000);
</script>
